{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BiblioTech</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased h-screen overflow-hidden flex">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden transition-opacity"></div>

    {% include "base/sidebar.html" %}

    <!-- Right-Side Column Wrapper (Locked to screen height, non-scrolling container) -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden min-w-0 bg-slate-50">
        
        <!-- 1. Permanent Sticky Header (Never moves or squishes) -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-30 shadow-xs">
            <div class="flex items-center space-x-4">
                <button id="sidebar-toggle" class="md:hidden text-slate-600 hover:text-slate-900 focus:outline-hidden">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h1 class="text-lg font-bold text-slate-800 truncate">Dashboard Overview</h1>
            </div>

            
        </header>

        <!-- 2. Independently Scrollable Middle Content Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 w-full">  
            <div class="max-w-7xl mx-auto space-y-6">
                {% block content %}
                
                {% endblock %}
            </div>
        </main>

        <!-- 3. Permanent Sticky Footer (Stays fixed at the bottom) -->
        <footer class="bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500 shrink-0">
            &copy; 2026 BiblioTech Library Management System. All rights reserved.
        </footer>
    </div>

    <!-- Responsive Sidebar Toggle JS -->
    <script src="{% static 'js/base.js' %}">
        
    </script>
</body>
</html>
