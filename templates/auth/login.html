<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | WTM Backend Libray System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900">Welcome Back</h3>
            <p class="text-xs text-slate-500 mt-1">Sign in to your library account</p>
        </div>

        <!-- Django Messages Block Goes Here -->
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
                <div class="p-3 rounded-xl text-xs font-medium flex items-center space-x-2 
                    {% if message.tags == 'error' %}
                        bg-rose-50 text-rose-700 border border-rose-200
                    {% elif message.tags == 'success' %}
                        bg-emerald-50 text-emerald-700 border border-emerald-200
                    {% else %}
                        bg-indigo-50 text-indigo-700 border border-indigo-200
                    {% endif %}">
                    <i class="fa-solid 
                        {% if message.tags == 'error' %}fa-circle-exclamation text-rose-500
                        {% elif message.tags == 'success' %}fa-circle-check text-emerald-500
                        {% else %}fa-circle-info text-indigo-500{% endif %} text-sm"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                {{ login.username }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                {{ login.password }}
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-lg transition-all">Sign In</button>
        </form>
        <p class="text-center text-xs text-slate-500 mt-6">Need an account? <a href="{% url 'accounts:registration' %}" class="text-indigo-600 font-semibold hover:underline">Register</a></p>
    </div>
</body>
</html>
